name: LINK RRSS · UX checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/comunescucha-ux.test.mjs
      - run: npm run build
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Validar escritorio y móvil con datos simulados
        run: node tests/comunescucha-visual.mjs
      - name: Guardar capturas de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comunescucha-visual
          path: test-artifacts/
          if-no-files-found: ignore
